name: Deploy to Live

on:
  push:
    branches:
      - main
  # Manual re-run, e.g. to flip a talk from upcoming to past. `past()` is evaluated at
  # build time now, where Kirby evaluated it per request. A scheduled rebuild is only
  # needed while a future talk is published — the build is byte-reproducible, so a
  # rebuild with no content change uploads nothing.
  workflow_dispatch:

# One deploy at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # node_modules/.astro is Astro's cacheDir: it holds both the sharp-processed
      # image variants (879 of them, the bulk of the build) and the fonts fetched
      # from Fontsource. Restoring it turns a cold multi-minute image build into a
      # near no-op. Keyed on content so a content change invalidates it.
      - name: ♻️ Restore Astro build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/content/**') }}
          restore-keys: |
            astro-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-

      - name: 🏗️ Build
        run: pnpm build

      # Guards the whole point of the migration: every one of the 57 indexed URLs
      # must exist, internal links must resolve, and the JSON-LD must be intact.
      # Cheap, and it fails the deploy rather than publishing a broken site.
      - name: ✅ Verify build output
        run: node scripts/verify.mjs

      # Uploads dist/ per wrangler.jsonc. Asset upload is content-hash based, so
      # only files that actually changed are transferred.
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
