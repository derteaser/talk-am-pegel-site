# pnpm 11 reads its settings from this file (no longer from .npmrc or package.json#pnpm).

# Dependency build scripts are opt-in. core-js-pure's postinstall only prints a
# funding banner, so it is explicitly denied instead of approved.
allowBuilds:
  core-js-pure: false
  # esbuild's postinstall installs its platform binary — required for Astro/Vite.
  esbuild: true
  # workerd is the Workers runtime wrangler uses for local dev and for validating
  # asset routing before deploy; its postinstall fetches the platform binary.
  workerd: true
